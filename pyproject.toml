[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbatching"
version = "0.2.0"
description = "Post-hoc hub selection over a trained reaction GFlowNet: library cost, not per-molecule synthesizability"
readme = "README.md"
requires-python = ">=3.10"
# Classic form on purpose: PEP 639 SPDX strings need setuptools >= 77.0.3, and a
# reviewer on an older toolchain would get a hard install failure rather than a
# deprecation warning.
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

# The core -- flow recovery, hub ranking, child/mode selection, the cost model --
# needs no deep-learning stack. That is deliberate: the numbers a reader wants to
# audit should not require installing torch to check. `hubbatching.cost` goes further
# and imports nothing but the standard library.
dependencies = [
  "rdkit>=2023.9",
]

[project.scripts]
hubbatching = "hubbatching.cli:main"

[project.optional-dependencies]
# Only hubbatching.adapters and hubbatching.chemistry.reaction_data_factory need these: reading a
# trained checkpoint, enumerating a hub's children, or turning a chemistry library into RGFN's
# action space all mean running the generator. gin lives here rather than in the core because it
# is RGFN plumbing -- hubbatching.hubs degrades to a no-op decorator without it (see
# hubbatching/_gin.py), so every strategy works, and only configuring one from a .gin file does not.
generators = ["torch>=2.0", "gin-config>=0.5"]
# reproduce/ writes its tables with the standard library alone and skips the plot if matplotlib is
# absent, so a reader can check every number without a plotting stack.
figures = ["matplotlib>=3.6"]
dev = ["pytest>=7", "nbstripout>=0.6"]
# Everything a tutorial notebook needs, and nothing a cluster does.
notebooks = ["matplotlib>=3.6", "jupyter>=1.0", "pandas>=2.0"]

[tool.setuptools.packages.find]
# Two roots. `src` is our code; `third_party` holds the vendored, unmodified upstream RGFN, which
# must stay importable as top-level `rgfn` because its own internal imports say so -- renaming it
# into a sub-package would mean editing upstream, which is exactly what vendoring avoids.
# See NOTICE for licensing and docs/PATCHES.md for every deliberate divergence.
where = ["src", "third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
