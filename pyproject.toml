[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbatching"
version = "0.1.0"
description = "Post-hoc hub selection over a trained reaction GFlowNet: library cost, not per-molecule synthesizability"
readme = "README.md"
requires-python = ">=3.10"
# Classic form on purpose: PEP 639 SPDX strings need setuptools >= 77.0.3, and a
# reviewer on an older toolchain would get a hard install failure rather than a
# deprecation warning.
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

# The core -- flow recovery, hub ranking, child/mode selection, the cost model --
# needs no deep-learning stack. That is deliberate: the numbers a reader wants to
# audit should not require installing torch to check. `hubbatching.cost` goes further
# and imports nothing but the standard library.
dependencies = [
  "gin-config>=0.5",
  "rdkit>=2023.9",
]

[project.optional-dependencies]
# Only hubbatching.adapters needs these: reading a trained checkpoint and enumerating
# a hub's children means running the generator.
generators = ["torch>=2.0"]
# reproduce/ writes its tables with the standard library alone and skips the plot if
# matplotlib is absent, so a reader can check every number without a plotting stack.
figures = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
